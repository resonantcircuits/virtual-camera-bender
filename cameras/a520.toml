# Canon PowerShot A520 (2005), 4 MP CCD compact, in physical units.
#
# Each value notes its confidence and source in docs/research/a520-technical.md:
# A = measured or stated for the A520, B = stated for the near-certain sibling part,
# C = documented substitute of the same class, D = derived. PROVISIONAL marks values
# that are placeholders or choices still to be validated.

[camera]
name = "a520"
maker = "Canon"
model = "PowerShot A520"
year = 2005

[lens]
vignette_stops = 0.6                # PROVISIONAL: corner falloff of a wide-open compact zoom, cos^4 law
nir_defocus_frac = 0.003            # PROVISIONAL: NIR focuses behind the sensor (1-2 px at f/4) and its charge spreads in the silicon; 6.8 px, the soft glow of full-spectrum photos, by eye
filter_edge_blur_frac = 0.06        # PROVISIONAL: IR-cut filter edge shadow, gap / f-number: an assumed 1 mm gap at f/4 (f/2.6-5.5, section 1) of the 4.26 mm height

[sensor]
native_width = 2272                 # A: largest JPEG size (key constants)
native_height = 1704                # A: largest JPEG size (key constants)
ob_cols = 48                        # D: A430 raw buffer margins (section 1); PROVISIONAL
pitch_um = 2.5                      # B: Sony ICX498 (section 3)
full_well_e = 17_800.0              # D: 22,000 e at 2.8 um scaled to 2.5 um (section 3)
white_fraction = 0.7                # PROVISIONAL: reference white at 70 % of the full well
nominal_exposure_s = 0.008          # PROVISIONAL: 1/125 s, the daylight exposure that puts reference white at white_fraction
read_noise_e = 12.0                 # PROVISIONAL: class typical (section 3)
dark_e_per_s = 1.0                  # PROVISIONAL: at 25 C; unpublished for ICX498 (section 3)
prnu = 0.01                         # PROVISIONAL: 1 % gain spread
dsnu_e = 2.0                        # PROVISIONAL: the readout chain's fixed offset pattern, the same at every temperature and exposure
dark_nonuniformity = 0.3            # PROVISIONAL: relative spread of the dark current over the photosites; tens of per cent for CCDs, the hot photosites its tail
conv_gain_uv_per_e = 26.0           # D: 460 mV / 17,800 e (key constants)
antibloom_ratio = 1000.0            # C: overflow drain absorbs 1000x full-well overexposure; PROVISIONAL
smear_db = -90.0                    # C: ICX452 high-frame-rate mode (section 3)
cte = 0.99999                       # C: interline CCDs (section 4)
hot_pixels_per_mpix = 5.0           # PROVISIONAL
reference_temp_c = 25.0             # C: room-temperature datasheet conditions, those of dark_e_per_s and read_noise_e above (Sony quotes dark signal at 60 C, section 3)
dark_doubling_c = 6.0               # C: CCD silicon doubles its dark current every 6 to 8 C near room temperature (thermal generation, Arrhenius rule; Janesick, Scientific Charge-Coupled Devices); unpublished for ICX498, PROVISIONAL within that range: 6 lets 70 C show its hottest photosites at 1/125 s (was 7; tuning by eye)
read_noise_per_c = 0.003            # PROVISIONAL: relative rise of the output amplifier's noise per degree; its thermal floor alone gives about 0.0017 (square root of absolute temperature)
amp_glow_e_per_s = 1.0              # PROVISIONAL: output amplifier glow at the readout's first corner one doubling above the reference, growing with the dark current's rise; by eye, heat shows hot crosses first and the corner glows only at long exposures (was 20 at the reference in the plan)
amp_glow_radius_frac = 0.15         # PROVISIONAL: 1/e falloff of the glow from that corner as a fraction of the width
substrate_v = 12.0                  # C: Sony interline CCDs, VSUB set per chip within about 9 to 15 V; unpublished for ICX498, mid-range
full_well_frac_per_v = 0.25         # PROVISIONAL: the well halves two volts above the nominal bias
drain_loss_v = 2.0                  # PROVISIONAL: a lower bias raises the overflow drain's barrier; the drain takes no excess two volts below nominal
nir_response = [1.0, 0.55, 0.5]     # C: Bayer dyes past 700 nm: red from 650 nm, green and blue past ~800 nm where silicon has lost half its response; PROVISIONAL, by eye
cfa = "RGGB"                        # PROVISIONAL: phase of the A520 mosaic unconfirmed
unit_seed = 1                       # this unit's fixed pattern (PRNU, DSNU, hot photosites, bus driver spread)

[still]
pixel_clock_hz = 27_000_000.0       # B: ICX498 horizontal drive (key constants)
hblank_px = 1244                    # D: 132 us line at 27 MHz minus 2272 + 48 stored samples
vblank_lines = 20                   # D: estimate; blanking is unpublished (Unknowns, item 2)
exposure_s = 0.008                  # PROVISIONAL: 1/125 s, a daylight exposure
smear = false                       # C: mechanical shutter closes during readout (section 3)
jpeg = "superfine"                  # A: quality setting (section 7)
direction = "top-down"              # PROVISIONAL

[movie]
pixel_clock_hz = 27_000_000.0       # B: ICX498 horizontal drive (key constants)
hblank_px = 1716                    # D: 66.7 ms / 446 lines, a 15 fps readout
vblank_lines = 20                   # D: estimate, as the still readout
line_skip = 4                       # C: line-decimated draft mode (section 2)
h_bin = 4                           # C: line-decimated draft mode (section 2)
fps = 15.0                          # A: 320x240 mode; the 640x480 mode is 10 fps (section 2); PROVISIONAL choice
exposure_s = 0.008                  # PROVISIONAL: electronic shutter at the daylight exposure, 1/125 s; at most 1/fps
output_width = 640                  # A: movie frame size (key constants)
output_height = 480                 # A: movie frame size (key constants)
jpeg = "normal"                     # PROVISIONAL: Motion JPEG quality setting
direction = "top-down"
smear = true                        # C: electronic shutter, smear visible (section 3)

[afe]
pga_gain_db = 6.2                   # D: 463 mV saturation scaled to 95 % of a 1.0 V full scale
pedestal_v = 0.0303                 # D: 124 / 4095 of 1.0 V
bandwidth_hz = 40_000_000.0         # PROVISIONAL
slew_v_per_us = 200.0               # PROVISIONAL
noise_1f_corner_hz = 20_000.0       # PROVISIONAL: CCD output amplifier flicker corner, class typical
oversample = 4
fd_swing_v = 0.6                    # PROVISIONAL: the CCD's source follower runs out first, its 460 mV saturation signal (section 3) plus a margin; C: the AD9949's 1.0 V p-p CDS input before saturation (section 5) bounds it from above

[adc]
bits = 12                           # C: AD9949 class AFE (section 5)
dsp_bits = 10                       # B: 10-bit raw of DIGIC I era cameras (key constants)
dsp_lsb = 2                         # D: the processor reads D11..D2 of the 12-bit bus
full_scale_v = 1.0                  # C: AD9949 input range (section 5)
black_level = 124                   # B: CHDK black 31 at 10 bits, 31 << 2 on the 12-bit bus
driver_r_ohm = 250.0                # PROVISIONAL: AD9949 VOH 2.2 V at 2 mA from 2.7 V, the guaranteed limit (was 150; tuning log)
driver_r_spread = 0.1               # PROVISIONAL
v_oh = 3.3                          # C: 3.3 V digital rail (section 5)
bus_series_ohm = 0.0                # PROVISIONAL: the S3 IS has 100 ohm arrays (section 10)
line_pf = 15.0                      # PROVISIONAL: pin, trace and processor input capacitance of one bus line
driver_slew_v_per_us = 600.0        # PROVISIONAL: AD9949 output transitions of a few nanoseconds (section 5)
dsp_threshold_v = 1.3               # PROVISIONAL: 3.3 V LVTTL-class input, between VIL 0.8 and VIH 2.0 (was 1.5; tuning log)
dsp_noise_mv = 5.0                  # PROVISIONAL
latch_phase = 0.75                  # PROVISIONAL: fraction of the pixel period

[logic]
hc_r_out_ohm = 90.0                 # D: half the guaranteed 108/217 ohm limits at 3.0 V (section 6)
hc_threshold_v = 1.6                # D: 74HC at 3.3 V (section 6)
hc_hysteresis_v = 0.05              # PROVISIONAL
hc_prop_delay_ns = 20.0             # C: 74HC00 typical, 30 ns max (section 6)
ff_fmax_hz = 15_000_000.0           # C: 74HC74 at 3.0 V (section 6)
ff_min_pulse_ns = 25.0              # C: 74HC74 clock pulse width (section 6)
ff_setup_ns = 35.0                  # C: 74HC74 setup time (section 6)
ff_prop_delay_ns = 40.0             # C: 74HC74 typical, 75 ns max (section 6)
clamp_diode_v = 0.5                 # C: 74HC input range -0.5 V to VCC + 0.5 V before the protection diodes conduct (section 6 datasheets)
clamp_r_ohm = 50.0                  # PROVISIONAL: series resistance of a conducting input protection diode
input_leak_mohm = 3.3               # C: 74HC input leakage, 1 uA over temperature (section 6 lists 0.1 uA at 25 C); PROVISIONAL

[power]
rail_v = 3.3                        # C: 3.3 V digital rail (section 5)
source_ohm = 0.5                    # PROVISIONAL: regulator and battery output impedance
decoupling_uf = 47.0                # PROVISIONAL: bulk decoupling on the rail
quiescent_ma = 60.0                 # PROVISIONAL: AFE, logic and processor input stage on the rail
afe_uvlo_v = 2.7                    # C: AD9949 class supplies 2.7 V minimum (section 5)
logic_min_v = 2.0                   # C: 74HC specified from VCC 2.0 V (section 6)
dsp_brownout_v = 2.4                # PROVISIONAL: the processor's 3.3 V I/O loses its capture below the AFE's lockout (was 2.9, a supervisor's trip point, which hid the lockout)
afe_restart_lines = 3               # PROVISIONAL: time constant, in native lines, of the AFE's black clamp re-establishing the pedestal after a lockout

[isp]
wb_r_gain = 2.0                     # PROVISIONAL: daylight
wb_b_gain = 1.5                     # PROVISIONAL: daylight
xyz_to_cam = [                      # C: dcraw "Canon PowerShot S60" / 10000, stand-in (section 8)
    [0.8795, -0.2482, -0.0797],
    [-0.7804, 1.5403, 0.2573],
    [-0.1422, 0.1996, 0.7082],
]
tone_contrast = 1.15                # PROVISIONAL
tone_toe = 0.02                     # PROVISIONAL
tone_shoulder = 0.10                # PROVISIONAL
chroma_nr_frac = 0.0008             # PROVISIONAL: keeps small saturated details (yellow flowers) coloured (was 0.002; tuning log)
luma_nr_frac = 0.0005               # PROVISIONAL
sharpen_radius_frac = 0.0004        # PROVISIONAL: about 0.9 px at 2272 wide, the mild ~0.5 px-radius USM of research section 9 (was 0.0005; tuning log)
sharpen_gain = 0.5                  # PROVISIONAL: thinner halos on twigs against water (was 0.6; tuning log)
ae_target = 0.18                    # PROVISIONAL: mid-grey
ae_mode = "fixed"                   # "scene" meters every frame, "servo" follows the bent raw with a lag; fixed keeps the exposure as set
ae_tau_s = 0.3                      # PROVISIONAL: time constant of the auto-exposure servo in movie and live view
wb_tau_s = 0.5                      # PROVISIONAL: time constant of the auto-white-balance servo
clamp_range = 128.0                 # PROVISIONAL: DIGIC's black-clamp correction either side of black in 10-bit codes, unknown; holds the DIV bend's D9 on optical black (up to 101 codes, so not 64) and leaves a locked-out AFE's mid-scale word coloured
demosaic = "malvar"                 # PROVISIONAL: DIGIC's algorithm is unpublished; gradient-corrected linear

[memory]
# The frame-buffer SDRAM. The A520's part is unidentified; the bits are the JEDEC
# organisation of a 128 Mbit x16 SDR SDRAM (4 banks of 4096 rows of 512 columns,
# 2^23 words, 16 MiB), which holds a 2272 x 1704 raw at one sample per word. The
# controller maps the linear word address row-bank-column (a modelling choice).
column_bits = 9                     # PROVISIONAL: 512 columns, multiplexed on pins a0..a8
row_bits = 12                       # PROVISIONAL: 4096 rows, multiplexed on pins a0..a11
bank_bits = 2                       # PROVISIONAL: four banks on their own pins, between column and row bits
raw_base = 0                        # PROVISIONAL: word address of the raw buffer; DIGIC's memory map is unpublished

[jpeg]
subsampling = "4:2:2"               # A: measured (section 7)
chroma_upsample = "bilinear"        # PROVISIONAL: decoder behaviour

