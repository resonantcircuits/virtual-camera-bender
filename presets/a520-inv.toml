# Canon PowerShot A520 with the ADC-bus bend: posterised negatives from the inverter driving D10.
# Source bank D9, D8, D7 through a 1 uF capacitor and a 0.5 kOhm setting of the
# 1 kOhm pot, function "invert", target D10.
camera = "a520"
seed = 1

[readout]
mode = "still"
resolution = "match-input"

[bend.bus]
source_pins = [9, 8, 7]
target = "pin:10"
function = "invert"
cap_uf = 1.0
pot_kohm = 0.5                      # PROVISIONAL: mid-travel of the 1 kOhm pot in the schematic
series_ohm = 0.0
common_bus = false
