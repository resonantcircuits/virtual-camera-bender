# Canon PowerShot A520 with the ADC-bus bend: horizontal streaks from the divide-by-two flip-flop.
# Source bank D8 through the 1 uF capacitor and a 0.5 kOhm setting of the 1 kOhm pot
# on the source bus, function "divide", target D9.
# Tuned against the reference DIV quadrant: docs/research/a520-tuning-log.md.
camera = "a520"
seed = 1

[readout]
mode = "still"
resolution = "match-input"

[bend.bus]
source_pins = [8]
target = "pin:9"
function = "divide"
cap_uf = 1.0
pot_kohm = 0.5                      # PROVISIONAL: mid-travel of the 1 kOhm pot in the schematic
pot_node = "s"                      # as the schematic draws it
series_ohm = 0.0
common_bus = false
