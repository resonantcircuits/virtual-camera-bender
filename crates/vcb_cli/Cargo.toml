[package]
name = "vcb_cli"
description = "Command line for the virtual camera bender: render, inspect, list presets."
keywords = ["camera", "ccd", "simulation", "circuit-bending", "cli"]
categories = ["multimedia::images", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "vcb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
mimalloc.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
vcb_core = { workspace = true, features = ["serde"] }
vcb_io.workspace = true

[lints]
workspace = true
