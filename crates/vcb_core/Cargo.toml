[package]
name = "vcb_core"
description = "Physical simulation of a circuit-bent early-2000s CCD compact camera."
keywords = ["camera", "ccd", "simulation", "circuit-bending", "glitch"]
categories = ["multimedia::images", "simulation"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["serde"]
# Serialize and deserialize the configuration types (camera files, presets).
serde = ["dep:serde"]
# Inspection of internal state for tests (M-TEST-UTIL).
test-util = []

[dependencies]
rayon.workspace = true
serde = { workspace = true, optional = true, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
divan.workspace = true
image = { workspace = true, features = ["png"] }
toml ={ workspace = true, features = ["parse", "serde", "display"] }

# Per-stage timings of the signal chain: `cargo bench -p vcb_core`.
[[bench]]
name = "stages"
harness = false
required-features = ["serde"]

[lints]
workspace = true
